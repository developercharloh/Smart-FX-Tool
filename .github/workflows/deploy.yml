name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Trigger Vercel production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy from GitHub source
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -d '{
              "name": "smart-fx-tool",
              "project": "${{ secrets.VERCEL_PROJECT_ID }}",
              "gitSource": {
                "type": "github",
                "repoId": "1203896619",
                "ref": "main"
              },
              "target": "production"
            }')
          echo "Deploy triggered: $(echo $RESPONSE | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("url","see Vercel dashboard"))' 2>/dev/null || echo 'check Vercel dashboard')"
